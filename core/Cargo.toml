[package]
name = "wiot_core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
async-trait = "0.1.88"
bytemuck = "1.22.0"
clap = { version = "4.5.40", features = ["derive"] }
image = { version = "0.25.6", features = ["avif", "avif-native"] }
sha2 = "0.10.9"
tokio = { version = "1.44.1", features = ["fs", "macros", "rt", "rt-multi-thread"] }
webp = "0.2.2"
